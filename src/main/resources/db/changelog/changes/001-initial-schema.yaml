databaseChangeLog:
  - changeSet:
      id: 001-create-authors-table
      author: smartquotes-admin
      changes:
        - createTable:
            tableName: authors
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: bio
                  type: text
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP

  - changeSet:
      id: 002-create-tags-table
      author: smartquotes-admin
      changes:
        - createTable:
            tableName: tags
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: 003-create-quotes-table
      author: smartquotes-admin
      changes:
        - createTable:
            tableName: quotes
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: text
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: quotes
            baseColumnNames: author_id
            referencedTableName: authors
            referencedColumnNames: id
            constraintName: fk_quotes_author_id
        - createIndex:
            tableName: quotes
            indexName: idx_quote_author
            columns:
              - column:
                  name: author_id

  - changeSet:
      id: 004-create-quote-tag-mapping
      author: smartquotes-admin
      changes:
        - createTable:
            tableName: quote_tag_mapping
            columns:
              - column:
                  name: quote_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: tag_id
                  type: bigint
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: quote_tag_mapping
            columnNames: quote_id, tag_id
            constraintName: pk_quote_tag_mapping
        - addForeignKeyConstraint:
            baseTableName: quote_tag_mapping
            baseColumnNames: quote_id
            referencedTableName: quotes
            referencedColumnNames: id
            constraintName: fk_mapping_quote_id
        - addForeignKeyConstraint:
            baseTableName: quote_tag_mapping
            baseColumnNames: tag_id
            referencedTableName: tags
            referencedColumnNames: id
            constraintName: fk_mapping_tag_id

  - changeSet:
      id: 005-create-user-interactions
      author: smartquotes-admin
      changes:
        - createTable:
            tableName: user_interactions
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: quote_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: interaction_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: user_interactions
            baseColumnNames: quote_id
            referencedTableName: quotes
            referencedColumnNames: id
            constraintName: fk_interaction_quote_id
        - createIndex:
            tableName: user_interactions
            indexName: idx_interaction_user
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: user_interactions
            indexName: idx_interaction_quote
            columns:
              - column:
                  name: quote_id